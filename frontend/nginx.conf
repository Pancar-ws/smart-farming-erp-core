# frontend/nginx.conf
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' http: https:; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "serial=(self), camera=(), microphone=(), geolocation=()" always;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
  }

  location = /config.json  { add_header Cache-Control "no-store"; }
  location = /index.html   { add_header Cache-Control "no-store"; }
  location /assets/        { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location /               { try_files $uri /index.html; }
}

